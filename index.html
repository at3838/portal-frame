const DWELL = 10000; // 每張 10 秒
let idx = 0, timer = null;
const stage = document.getElementById('stage');
const capEl = document.getElementById('cap');
// 預載
PHOTOS.forEach(p => {{ const im = new Image(); im.src = p[0]; }});
function show(i) {{
  idx = (i + PHOTOS.length) % PHOTOS.length;
  stage.querySelectorAll('img').forEach(im => im.classList.remove('on'));
  let im = stage.children[idx];
  if (!im) {{
    im = document.createElement('img');
    im.src = PHOTOS[idx][0];
    stage.appendChild(im);
  }}
  // 確保唔會無限加
  while (stage.children.length > PHOTOS.length) stage.removeChild(stage.firstChild);
  im = stage.children[idx];
  im.classList.add('on');
  const d = PHOTOS[idx][1], c = PHOTOS[idx][2];
  capEl.textContent = [d, c].filter(Boolean).join('  ');
}}
function tick() {{ show(idx + 1); timer = setTimeout(tick, DWELL); }}
function tickClock() {{
  const n = new Date();
  const p = x => String(x).padStart(2, '0');
  document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes());
  document.getElementById('date').textContent =
    n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'  '+
    ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][n.getDay()];
}}
document.addEventListener('click', () => {{
  clearTimeout(timer);
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{{}});
  else document.documentElement.requestFullscreen().catch(()=>{{}});
  show(idx + 1); timer = setTimeout(tick, DWELL);
  document.getElementById('hint').style.display = 'none';
}});
if (PHOTOS.length) {{
  // 先起頭幾張嘅 img
  const n = Math.min(PHOTOS.length, 5);
  for (let i = 0; i < n; i++) {{
    const im = document.createElement('img'); im.src = PHOTOS[i][0];
    stage.appendChild(im);
  }}
  show(0); timer = setTimeout(tick, DWELL);
}} else {{
  document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;padding:40px">相簿暫時冇相</div>';
}}
tickClock(); setInterval(tickClock, 20000);
// 每 6 小時 reload 攞新 URL（簽名 URL 約一日過期）+ 新相
setTimeout(() => location.reload(), 6 * 3600 * 1000);
</script>
