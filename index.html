<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>屋企相架</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;top:0;left:0;right:0;bottom:0;background:#000}
  #stage img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1.2s ease}
  #stage img.on{opacity:1}
  #meta{position:fixed;left:0;right:0;bottom:0;padding:18px 26px;color:#fff;
    font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;
    display:flex;justify-content:space-between;align-items:flex-end;
    text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
  #clock{font-size:44px;font-weight:200;letter-spacing:2px}
  #date{font-size:20px;opacity:.85;margin-top:4px}
  #cap{font-size:20px;opacity:.85;text-align:right;max-width:45%}
  #hint{position:fixed;top:14px;right:18px;color:rgba(255,255,255,.35);
    font-size:14px;font-family:sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="meta">
  <div><div id="clock"></div><div id="date"></div></div>
  <div id="cap"></div>
</div>
<div id="hint">撳一下轉下一張</div>
<script>
var PHOTOS = [];
var DWELL = 10000;
var idx = 0, timer = null;
var stage = document.getElementById('stage');
var capEl = document.getElementById('cap');

function updateCap() {
  if (!PHOTOS.length) return;
  var d = PHOTOS[idx][1], c = PHOTOS[idx][2];
  capEl.textContent = d + (c ? '  ' + c : '') + '   ' + (idx + 1) + '/' + PHOTOS.length;
}

function rebuildStage() {
  stage.innerHTML = '';
  if (!PHOTOS.length) return;
  if (idx >= PHOTOS.length) idx = 0;
  for (var i = 0; i < PHOTOS.length; i++) {
    var im = document.createElement('img');
    im.src = PHOTOS[i][0];
    if (i === idx) im.className = 'on';
    stage.appendChild(im);
  }
  updateCap();
}

function show(i) {
  if (!PHOTOS.length) return;
  idx = ((i % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
  var kids = stage.children;
  for (var j = 0; j < kids.length; j++) {
    kids[j].className = (j === idx) ? 'on' : '';
  }
  updateCap();
}

function tick() { show(idx + 1); timer = setTimeout(tick, DWELL); }

function tickClock() {
  var n = new Date();
  function p(x) { x = String(x); return x.length < 2 ? '0' + x : x; }
  document.getElementById('clock').textContent = p(n.getHours()) + ':' + p(n.getMinutes());
  var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('date').textContent =
    n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + '  ' + week[n.getDay()];
}

function loadPhotos() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'photos.json?_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        if (data && data.length) { PHOTOS = data; rebuildStage(); }
      } catch (e) {}
    }
  };
  xhr.send();
}

document.addEventListener('click', function() {
  clearTimeout(timer);
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) {}
  show(idx + 1); timer = setTimeout(tick, DWELL);
  document.getElementById('hint').style.display = 'none';
});

tickClock(); setInterval(tickClock, 20000);
loadPhotos();
setInterval(loadPhotos, 10 * 60 * 1000);
timer = setTimeout(function waitPhotos() {
  if (PHOTOS.length) { show(idx); timer = setTimeout(tick, DWELL); }
  else timer = setTimeout(waitPhotos, 1000);
}, 1000);
</script>
</body>
</html>
